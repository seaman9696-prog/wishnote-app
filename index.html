<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FAF8F5">
  <meta name="referrer" content="no-referrer">
  <title>ウィッシュノート</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      background: #FAF8F5;
      color: #3A3A3A;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      overflow: hidden;
    }
    #app {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    #setup {
      display: none;
      max-width: 400px;
      margin: 0 auto;
      padding: 48px 16px;
      text-align: center;
    }
    #setup img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
    }
    #setup h1 {
      font-size: 18px;
      margin-top: 16px;
    }
    #setup p {
      font-size: 13px;
      line-height: 1.7;
      margin-top: 12px;
    }
    #setup input {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: 1px solid #DDD;
      border-radius: 10px;
      font-size: 16px;
    }
    #setup button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #607B65;
      color: #FFF;
      font-size: 14px;
      font-weight: bold;
    }
    #setupError {
      display: none;
      color: #C36B47;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <iframe id="app" title="ウィッシュノート"></iframe>
  <div id="setup">
    <img src="icons/icon-192.png" alt="">
    <h1>ウィッシュノート</h1>
    <p>共有された設定用リンクをコピーして、下の欄に貼り付けてください。</p>
    <input id="setupInput" type="text" placeholder="ここに設定用リンクを貼り付け" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="setupButton" type="button">設定して開く</button>
    <p id="setupError">リンクを読み取れませんでした。リンク全体をコピーできているか確認してください。</p>
  </div>

  <script>
    // アプリのURLは誰でも編集できる鍵になるので、公開するこのページには書かない。
    // 設定用リンク（#d=デプロイID）で受け取り、端末の中にだけ保存する。
    var STORAGE_KEY = 'wishnote_deployment_id';

    function isValidId(id) {
      return /^AKfycb[A-Za-z0-9_-]{40,}$/.test(id);
    }

    // リンク全体でもIDだけでも受け付ける。貼り付け時に混ざる改行や空白は無視する
    function extractId(text) {
      var found = String(text).replace(/\s+/g, '').match(/AKfycb[A-Za-z0-9_-]+/);
      return found && isValidId(found[0]) ? found[0] : null;
    }

    function readSavedId() {
      try {
        return localStorage.getItem(STORAGE_KEY);
      } catch (e) {
        return null;
      }
    }

    function saveId(id) {
      try {
        localStorage.setItem(STORAGE_KEY, id);
      } catch (e) {}
    }

    function openApp(id) {
      var frame = document.getElementById('app');
      frame.src = 'https://script.google.com/macros/s/' + id + '/exec';
      frame.style.display = 'block';
      document.getElementById('setup').style.display = 'none';
    }

    document.getElementById('setupButton').onclick = function() {
      var id = extractId(document.getElementById('setupInput').value);
      if (!id) {
        document.getElementById('setupError').style.display = 'block';
        return;
      }
      saveId(id);
      openApp(id);
    };

    var linkedId = extractId(decodeURIComponent(location.hash));
    if (linkedId) {
      saveId(linkedId);
    }
    if (location.hash) {
      history.replaceState(null, '', location.pathname);
    }

    var deploymentId = linkedId || readSavedId();
    if (deploymentId && isValidId(deploymentId)) {
      openApp(deploymentId);
    } else {
      document.getElementById('setup').style.display = 'block';
    }
  </script>
</body>
</html>
